name: Refresh Airtable cache and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run cache
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ vars.AIRTABLE_TABLE_NAME }}
          AIRTABLE_VIEW: ${{ vars.AIRTABLE_VIEW }}
          AIRTABLE_CASESTUDIES_TABLE_NAME: ${{ vars.AIRTABLE_CASESTUDIES_TABLE_NAME }}
          AIRTABLE_CASESTUDIES_VIEW: ${{ vars.AIRTABLE_CASESTUDIES_VIEW }}
          AIRTABLE_MA_BASE_ID: ${{ secrets.AIRTABLE_MA_BASE_ID }}
          AIRTABLE_SOURCES_TABLE_NAME: ${{ vars.AIRTABLE_SOURCES_TABLE_NAME }}
          AIRTABLE_SOURCES_VIEW: ${{ vars.AIRTABLE_SOURCES_VIEW }}
          AIRTABLE_ARTICLES_TABLE_NAME: ${{ vars.AIRTABLE_ARTICLES_TABLE_NAME }}
          AIRTABLE_ARTICLES_VIEW: ${{ vars.AIRTABLE_ARTICLES_VIEW }}
          AIRTABLE_MA_CASESTUDIES_TABLE_NAME: ${{ vars.AIRTABLE_MA_CASESTUDIES_TABLE_NAME }}
          AIRTABLE_MA_CASESTUDIES_VIEW: ${{ vars.AIRTABLE_MA_CASESTUDIES_VIEW }}
          INCLUDE_TABLE_IDS: ${{ vars.INCLUDE_TABLE_IDS }}
          EXCLUDE_TABLE_IDS: ${{ vars.EXCLUDE_TABLE_IDS }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
