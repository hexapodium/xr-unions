<!--
  Single copy-paste snippet for Squarespace Code Block.
  This contains the CSS, a sample HTML wrapper, and the JS required to make
  inline links with class="expando-link" open a split view card populated
  from /groups.json or a custom JSON URL set on the wrapper's data-groups-url.
-->
<link rel="stylesheet" href="expando.css">
<div id="expando-root" data-groups-url="../public/groups.json">
  <p>
    Read more about the work of <a class="expando-link" data-group-id="example">Example XR Group</a> in our research.
  </p>
  
  <!-- Sample gallery: set data-groups="id1,id2,..." or let JS render from groups.json -->
  <div class="expando-gallery" style="margin-top:1rem;">
    <!-- JS will render items here on init; static fallback below for editors -->
  </div>
  <div id="expando-status" aria-hidden="false" style="margin-top:.5rem;font-size:.9rem;color:#444"></div>
</div>

<script src="./expando.js"></script>
