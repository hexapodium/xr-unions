<!--
  Copy-paste snippet for a Squarespace Code Block.

  Renders a 4-across icon grid of the WCP26 group write-ups. The content is
  defined *right here in this block* as Markdown in the `groups` attribute
  below — nothing is fetched from an external file, so adding or editing a
  group means editing this block, not the repo. Clicking a tile expands a
  summary panel beneath it.

  HOW TO WRITE THE CONTENT
  ------------------------
    ## Section heading      starts a new section of the page (groups are
                            shown under their heading, in the order written)
    ### Group name          starts a new group (one tile in the grid)
    icon: https://...       optional, first line under a ### heading — the
                            tile's icon image (otherwise a letter placeholder)
    +++ Dropdown heading    starts a collapsible dropdown, closed by default
                            (use for "Relevant docs" and "Links")
    - item                  bullet list item
    [text](https://...)     inline link — works in any text, like a Google Doc
    **bold**  *italic*      inline emphasis
    anything else           a paragraph; blank lines separate paragraphs

  TO ADD A NEW GROUP: copy an existing ### block and edit it. Keep the
  indentation consistent (everything is inside the quoted groups="..."
  attribute, so don't use a double-quote character " in the text — a
  single quote ' is fine).
-->
<script type="module" src="https://hexapodium.github.io/xr-unions/group-grid.js"></script>
<link rel="stylesheet" href="https://hexapodium.github.io/xr-unions/styles.css">

<group-grid label="groups" groups="

## Example section

### Example Group
An intro paragraph with an [inline link](https://example.com) formatted
the way it would read in a Google Doc.

- First key activity
- Second key activity

+++ Relevant docs
- [Some report](https://example.com/report.pdf)
- [Another doc](https://example.com/doc)

+++ Links
- [Website](https://example.com)

### Another Group
icon: https://hexapodium.github.io/xr-unions/icons/example.svg
This one has a custom icon instead of the letter placeholder.

"></group-grid>
