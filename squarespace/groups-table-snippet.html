<!--
  Copy-paste snippet for a Squarespace Code Block.

  Renders a 4-across icon grid of the WCP26 group write-ups
  (public/groups-table.json, generated by scripts/parse-wcpwriteups.js from
  the docx files in wcpwriteups/) plus a "Copy" button for the direct/CORS
  link, loading the same group-grid.js/copy-link.js used on
  public/index.html straight from GitHub Pages. Clicking a tile expands a
  summary panel (Group name, Relevant docs, Relevant links, Group intro,
  Key group activities, Additional info) beneath it — every other column
  is dropped from the rendered view.

  Ready to paste as-is — it points at:
    https://hexapodium.github.io/xr-unions/groups-table.json

  To show a manually-cached icon for a group instead of the default
  letter-on-circle placeholder, add entries to the `icons` attribute below,
  keyed by the group's `id` field (e.g. "FoE", "TUCAN") from
  groups-table.json, mapped to an absolute icon URL.
-->
<script type="module" src="https://hexapodium.github.io/xr-unions/group-grid.js"></script>
<script type="module" src="https://hexapodium.github.io/xr-unions/copy-link.js"></script>
<link rel="stylesheet" href="https://hexapodium.github.io/xr-unions/styles.css">

<copy-link href="https://hexapodium.github.io/xr-unions/groups-table.json"></copy-link>
<group-grid
  src="https://hexapodium.github.io/xr-unions/groups-table.json"
  label="groups"
  name-column="Group Name"
  icons='{}'
></group-grid>
