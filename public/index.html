<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group grid preview</title>
<style>body { max-width: 72rem; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }</style>
<h1>Group grid preview</h1>
<p>Preview <code>squarespace/group-grid-snippet.html</code> or a Markdown draft by selecting it below. The default shows two example groups.</p>
<label>Choose a local snippet or Markdown draft <input type="file" accept=".html,.md"></label>
<output role="status"></output>
<script type="module" src="group-grid.js"></script>
<script>
// Pulls the authored Markdown out of a snippet file. The *last*
// <group-grid groups="..."> wins, because the generated self-contained
// snippet (squarespace/group-grid-inline.html) inlines group-grid.js,
// whose header comment contains a miniature example of the same tag.
function groupsFromSnippet(html) {
  let markdown = null;
  for (const match of html.matchAll(/<group-grid[^>]*\bgroups="([\s\S]*?)"\s*>/g)) {
    markdown = match[1];
  }
  // The attribute is HTML-escaped in the file; decode it back to Markdown.
  if (markdown === null) return null;
  const decoder = document.createElement("textarea");
  decoder.innerHTML = markdown;
  return decoder.value;
}

// Strips a leading HTML comment banner from a Markdown draft. Built via
// RegExp rather than a literal so the "<!--" / "-->" sequences never appear
// verbatim inside this inline <script>, where they'd confuse HTML parsers.
const LEADING_HTML_COMMENT = new RegExp(`^<!${"--"}[\\s\\S]*?${"--"}>\\s*`);

document.querySelector('input[type="file"]').addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const text = await file.text();
  const markdown = file.name.endsWith(".html")
    ? groupsFromSnippet(text)
    : text.replace(LEADING_HTML_COMMENT, "");
  const status = document.querySelector("output");
  if (!markdown?.trim()) {
    status.textContent = "No group Markdown found in this file.";
    return;
  }
  status.textContent = "";
  const grid = document.querySelector("group-grid").cloneNode(false);
  grid.setAttribute("groups", markdown);
  document.querySelector("group-grid").replaceWith(grid);
});
</script>
<group-grid label="groups" groups="
## Union green groups & networks
### PCS Green Workplaces
icon: icons/PCS.jpg
PCS campaigns for climate action across workplaces.
- Coordinate Green Representatives
+++ Relevant docs
- [PCS Green Workplaces](https://www.pcs.org.uk/campaigns/green-workplaces)
### BFAWU Green Reps
icon: icons/BFAWU.svg
Workplace action for a just transition.
"></group-grid>
